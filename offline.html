<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline - Osiris Watch</title>
  <meta name="theme-color" content="#0b0b0d" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #0b0b0d; color: #ececee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 380px; }
    .badge {
      width: 68px; height: 68px; border-radius: 16px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .badge svg { width: 68px; height: 68px; display: block; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; letter-spacing: -0.02em; }
    p { color: #8b8b95; font-size: 0.92rem; line-height: 1.6; margin-bottom: 24px; }
    button {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
      background: #3b82f6; color: #ffffff; padding: 11px 24px; border-radius: 20px;
      transition: transform .15s ease, background .2s ease;
    }
    button:hover { background: #2563eb; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="68" height="68" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bg3" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#04070D"/>
          </linearGradient>
          <linearGradient id="owBlue" x1="96" y1="112" x2="416" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#93C5FD"/>
            <stop offset="50%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
          <linearGradient id="owSteel" x1="140" y1="130" x2="380" y2="390" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#94A3B8"/>
          </linearGradient>
        </defs>
        <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg3)" stroke="#1E293B" stroke-width="4"/>
        <path d="M358 148C332 122 296 106 256 106C173.157 106 106 173.157 106 256C106 338.843 173.157 406 256 406C296 406 332 390 358 364" stroke="url(#owBlue)" stroke-width="34" stroke-linecap="round"/>
        <path d="M188 196L226 324L268 232L310 324L356 184" stroke="url(#owSteel)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M370 218L428 256L370 294V218Z" fill="#3B82F6"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Osiris Watch needs a connection to stream. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
